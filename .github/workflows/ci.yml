name: ci
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build everything (net48 targets build on Linux through reference assemblies)
        run: dotnet build vha.sln --configuration Release
      - name: Unit tests
        run: dotnet test tests/Vha.Core.Tests --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/Vha.Core.Tests/TestResults/*.trx
